name: Bug report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release or commit you are using.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any secrets or personal information first.
