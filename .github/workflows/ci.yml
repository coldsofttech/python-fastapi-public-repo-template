name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: Check the OpenAPI document is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code docs/openapi.json
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: pytest # covered by the test job across all Python versions

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest

  integration:
    name: integration (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest -m integration --no-cov

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build --tag example-api:ci .
      - name: Smoke test the container
        run: |
          docker run --detach --name api --publish 8000:8000 example-api:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              docker rm --force api
              exit 0
            fi
            sleep 1
          done
          docker logs api
          docker rm --force api
          exit 1

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Smoke test the built wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import example_api.main"

  # Single required status check for the branch ruleset.
  ci:
    if: always()
    needs: [lint, test, integration, docker, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          echo "lint:        ${{ needs.lint.result }}"
          echo "test:        ${{ needs.test.result }}"
          echo "integration: ${{ needs.integration.result }}"
          echo "docker:      ${{ needs.docker.result }}"
          echo "build:       ${{ needs.build.result }}"
          [ "${{ needs.lint.result }}" = success ] &&
          [ "${{ needs.test.result }}" = success ] &&
          [ "${{ needs.integration.result }}" = success ] &&
          [ "${{ needs.docker.result }}" = success ] &&
          [ "${{ needs.build.result }}" = success ]
